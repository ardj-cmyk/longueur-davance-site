<!doctype html>
<html lang="fr">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Maquette 3D interactive</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Narrow:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout : maquette WebGL plein écran ; panneau « table à dessin » à gauche ; calque du dessin d'origine en bas à droite */
:root{
  --scene:#e6e7e2; --paper:#fbfbf8; --ink:#1e2320; --muted:#5f6863; --line:#d3d6cf; --accent:#b8322a;
  --ok:#2c7149; --warn:#a8481a; --info:#45627e; --chip-ok:#e1eee5; --chip-warn:#f7e5da; --chip-info:#e2e9f0;
  --label-ink:#1e2320; --label-halo:rgba(251,251,248,.95);
  --f-display:"Archivo Narrow","Arial Narrow",Arial,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --scene:#171a19; --paper:#202423; --ink:#e7eae5; --muted:#9ba49e; --line:#373d3a; --accent:#e36b60;
  --ok:#73c595; --warn:#eba06e; --info:#94b6d8; --chip-ok:#1d3226; --chip-warn:#3b2a1f; --chip-info:#1e2a37;
  --label-ink:#eef1ec; --label-halo:rgba(23,26,25,.9); color-scheme:dark}}
:root[data-theme="dark"]{
  --scene:#171a19; --paper:#202423; --ink:#e7eae5; --muted:#9ba49e; --line:#373d3a; --accent:#e36b60;
  --ok:#73c595; --warn:#eba06e; --info:#94b6d8; --chip-ok:#1d3226; --chip-warn:#3b2a1f; --chip-info:#1e2a37;
  --label-ink:#eef1ec; --label-halo:rgba(23,26,25,.9); color-scheme:dark}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--scene);color:var(--ink);font-family:var(--f-body);font-size:14px;overflow:hidden}
#c{position:fixed;inset:0;display:block;width:100%;height:100%;touch-action:none}
#labels{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.lbl{position:absolute;transform:translate(-50%,-50%);font:600 12px/1.15 var(--f-body);color:var(--label-ink);white-space:nowrap;text-align:center;
  text-shadow:0 0 2px var(--label-halo),0 0 4px var(--label-halo),0 0 8px var(--label-halo)}
.lbl small{display:block;font:400 10px/1.3 var(--f-mono);color:var(--muted)}
.lbl.muted{color:var(--muted);font-weight:500;font-style:italic}
.lbl.site{font:500 10.5px/1.2 var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}

.panel{position:fixed;z-index:3;top:calc(16px + env(safe-area-inset-top,0px));left:16px;width:324px;max-height:calc(100% - 32px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));
  display:flex;flex-direction:column;background:var(--paper);border:1px solid var(--line);box-shadow:0 10px 30px rgba(0,0,0,.10)}
.head{padding:14px 16px 12px;border-bottom:1px solid var(--line);display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
h1{margin:0;font:700 24px/1 var(--f-display);letter-spacing:.01em;text-wrap:balance}
.sub{margin-top:5px;font:400 11px/1.35 var(--f-mono);color:var(--muted)}
.collapse{display:none}
.body{overflow:auto;min-height:0;padding:12px 16px 16px;display:flex;flex-direction:column;gap:16px}
.sec-t{font:500 10.5px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 7px}
.views{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.views button{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;padding:7px 9px;background:transparent;color:var(--ink);
  border:1px solid var(--line);cursor:pointer;font:600 13px/1.1 var(--f-display);letter-spacing:.02em}
.views button span{font:400 10px var(--f-mono);color:var(--muted);letter-spacing:0}
.views button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.views button[aria-pressed="true"] span{color:var(--paper);opacity:.75}
.views button:hover{border-color:var(--muted)}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ctl{display:flex;flex-direction:column;gap:6px}
.ctl label{display:flex;justify-content:space-between;gap:8px;font:500 10.5px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.ctl label b{font-weight:500;color:var(--ink);letter-spacing:0;text-transform:none;font-variant-numeric:tabular-nums}
input[type=range]{width:100%;accent-color:var(--accent)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{font:500 11px var(--f-mono);padding:4px 8px;background:transparent;color:var(--ink);border:1px solid var(--line);cursor:pointer}
.chips button[aria-pressed="true"]{border-color:var(--accent);color:var(--accent)}
.toggles{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px}
.toggles label{display:flex;align-items:center;gap:6px;cursor:pointer}
input[type=checkbox]{accent-color:var(--accent);width:14px;height:14px;margin:0}
.legend{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:11px;height:11px;vertical-align:-1px;margin-right:6px;border:1px solid rgba(0,0,0,.18)}
details.checks{border-top:1px solid var(--line);padding-top:12px}
details.checks summary{cursor:pointer;list-style:none;display:flex;flex-direction:column;gap:6px}
details.checks summary::-webkit-details-marker{display:none}
.sum-t{font:600 15px var(--f-display);letter-spacing:.02em;display:flex;justify-content:space-between}
.sum-t::after{content:"＋";font:400 14px var(--f-mono);color:var(--muted)}
details[open] .sum-t::after{content:"－"}
.counts{display:flex;gap:6px;flex-wrap:wrap}
.chip{font:500 10.5px/1 var(--f-mono);padding:4px 6px;white-space:nowrap}
.chip.ok{background:var(--chip-ok);color:var(--ok)}.chip.warn{background:var(--chip-warn);color:var(--warn)}.chip.info{background:var(--chip-info);color:var(--info)}
.checks ol{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-direction:column;gap:9px}
.checks li{display:grid;grid-template-columns:62px 1fr;gap:8px;font-size:12.5px;line-height:1.45;align-items:start}
.checks li .chip{text-align:center;margin-top:1px}
.checks li p{margin:0;min-width:0}
.checks li b{font-weight:600}

.ref{position:fixed;z-index:3;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));width:272px;background:var(--paper);border:1px solid var(--line);box-shadow:0 10px 30px rgba(0,0,0,.10);display:flex;flex-direction:column}
.ref .thumb{display:block;padding:0;border:0;border-bottom:1px solid var(--line);background:#fff;cursor:zoom-in;height:150px;width:100%}
.ref .thumb img{width:100%;height:100%;object-fit:contain;display:block}
.ref-b{padding:10px 12px 12px;display:flex;flex-direction:column;gap:8px}
.ref-t{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.ref-t strong{font:600 14px var(--f-display);letter-spacing:.02em}
.ref-t span{font:400 10.5px var(--f-mono);color:var(--muted)}
.ref-note{font-size:11.5px;color:var(--muted);line-height:1.4;margin:0}
.hud{position:fixed;z-index:2;left:356px;bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;align-items:flex-end;gap:16px;pointer-events:none}
.compass{width:54px;height:54px;border-radius:50%;background:var(--paper);border:1px solid var(--line);position:relative;display:grid;place-items:center}
.compass svg{width:46px;height:46px;transition:transform .08s linear}
.facing{font:500 10.5px var(--f-mono);color:var(--muted);background:var(--paper);border:1px solid var(--line);padding:5px 8px}
.scalebar{display:flex;flex-direction:column;gap:3px;font:400 10px var(--f-mono);color:var(--ink)}
.scalebar .bar{display:flex;height:6px;border:1px solid var(--ink)}
.scalebar .bar i{display:block;height:100%}
.scalebar .bar i:first-child{background:var(--ink)}
.scalebar .nums{display:flex;justify-content:space-between}
.hint{position:fixed;z-index:1;right:304px;bottom:calc(18px + env(safe-area-inset-bottom,0px));font:400 10.5px var(--f-mono);color:var(--muted);text-align:right;pointer-events:none}
.lightbox{position:fixed;inset:0;z-index:10;background:rgba(10,12,11,.82);display:flex;flex-direction:column;padding:16px;gap:10px}
.lightbox .lb-top{display:flex;justify-content:space-between;align-items:center;color:#f2f2ee;font:600 15px var(--f-display);letter-spacing:.02em;gap:12px}
.lightbox button{font:500 12px var(--f-mono);background:#f2f2ee;color:#1e2320;border:0;padding:7px 12px;cursor:pointer}
.lightbox .lb-img{flex:1;min-height:0;overflow:auto;background:#fff;display:flex;align-items:center;justify-content:center}
.lightbox img{max-width:100%;max-height:100%;object-fit:contain}
.lightbox img.zoom{max-width:none;max-height:none;width:200%}
.lbl.hot::after{content:"";display:block;height:2px;width:70%;margin:3px auto 0;background:var(--accent)}

/* outils : personnage à déposer, noms des pièces */
.tools{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:6px}
.tools button{display:flex;align-items:center;gap:8px;text-align:left;padding:7px 9px;background:transparent;color:var(--ink);border:1px solid var(--line);cursor:pointer;font:600 13px/1.1 var(--f-display);letter-spacing:.02em}
.tools .t{display:flex;flex-direction:column;gap:2px;min-width:0}
.tools .t span{font:400 10px/1.2 var(--f-mono);color:var(--muted);letter-spacing:0}
.tools svg{flex:none;width:22px;height:22px}
.tools button[aria-pressed="true"]{border-color:var(--accent);color:var(--accent)}
#pegman{cursor:grab;touch-action:none;border-color:var(--accent)}
body.dragging,body.dragging *{cursor:grabbing!important;user-select:none}

/* visite à la première personne */
body.pov .panel,body.pov .ref,body.pov .hud,body.pov .hint,body.pov #labels{display:none!important}
body.pov #c{cursor:grab}
body.pov #c:active{cursor:grabbing}
.pov-bar{position:fixed;z-index:6;top:calc(16px + env(safe-area-inset-top,0px));left:16px;display:flex;align-items:center;gap:10px}
.pov-bar button{font:600 15px var(--f-display);letter-spacing:.02em;padding:9px 14px;background:var(--paper);color:var(--ink);border:1px solid var(--line);cursor:pointer;box-shadow:0 6px 20px rgba(0,0,0,.2)}
.pov-room{font:500 10.5px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);background:var(--paper);border:1px solid var(--line);padding:6px 9px}
.pov-help{position:fixed;z-index:6;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);font:500 12px/1.4 var(--f-mono);color:#f4f4f0;background:rgba(18,20,19,.68);padding:8px 12px;text-align:center;max-width:calc(100% - 32px);pointer-events:none;transition:opacity .8s}
.pov-help.fade{opacity:0}
.pad{display:none;position:fixed;z-index:6;left:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));grid-template-columns:repeat(3,54px);grid-template-rows:repeat(2,54px);gap:6px}
.pad button{background:var(--paper);color:var(--ink);border:1px solid var(--line);font:600 18px var(--f-mono);touch-action:none;opacity:.88}
.pad .u{grid-column:2;grid-row:1}.pad .l{grid-column:1;grid-row:2}.pad .d{grid-column:2;grid-row:2}.pad .r{grid-column:3;grid-row:2}
@media (pointer:coarse){.pad{display:grid}}

@media (max-width:820px){
  .panel{width:auto;right:16px;max-height:52%}
  .collapse{display:inline-block;font:500 11px var(--f-mono);padding:5px 8px;background:transparent;color:var(--ink);border:1px solid var(--line);cursor:pointer}
  .panel.min .body > :not(.keep){display:none}
  .views{grid-template-columns:repeat(4,1fr)}
  .views button{padding:6px 7px;font-size:12px}
  .views button span{display:none}
  .hud{left:16px}
  .ref{width:200px}
  .ref .thumb{height:96px}
  .ref-note{display:none}
  .hint{display:none}
}
@media (max-width:480px){
  .views{grid-template-columns:repeat(3,1fr)}
  .ref{width:150px}
  .ref .thumb{height:70px}
  .ref-b{padding:8px}
  .ref-t span{display:none}
  .compass{width:44px;height:44px}.compass svg{width:38px;height:38px}
  .hud{flex-direction:column;align-items:flex-start;gap:6px}
}
@media (prefers-reduced-motion:reduce){.compass svg{transition:none}}
</style>

<canvas id="c" aria-label="Maquette 3D d'une maison"></canvas>
<div id="labels"></div>

<aside class="panel" id="panel">
  <div class="head">
    <div>
      <h1>Maquette 3D</h1>
      <div class="sub">Plan RDC · coupes AA et paysagère · élévation NO · aérien</div>
    </div>
    <button class="collapse" id="collapse" aria-expanded="true">Réduire</button>
  </div>
  <div class="body">
    <div class="keep">
      <div class="sec-t">Vues</div>
      <div class="views" id="views"></div>
      <div class="tools">
        <button id="pegman" title="Glisser le personnage dans la maison pour la visiter à la première personne">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="4.4" r="2.7" fill="var(--accent)"/><path d="M8 9.4c0-1.2 1-2.2 2.2-2.2h3.6c1.2 0 2.2 1 2.2 2.2v5.2h-2V22h-4v-7.4H8z" fill="var(--accent)"/></svg>
          <span class="t">Visite<span id="pegSub">glisser dans la maison</span></span>
        </button>
        <button id="tNames" aria-pressed="false">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h11M4 18h14" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/></svg>
          <span class="t">Tous les noms<span id="tNamesSub">au survol seulement</span></span>
        </button>
      </div>
    </div>

    <div class="ctl" id="ctlCut">
      <label for="cutH">Hauteur de coupe <b id="cutHv">aucune</b></label>
      <input id="cutH" type="range" min="0.4" max="8" step="0.05" value="8">
      <div class="chips" id="cutChips">
        <button data-h="1.2">RDC 1,20 m</button>
        <button data-h="3.95">Étage 3,95 m</button>
        <button data-h="8">Toiture</button>
      </div>
    </div>
    <div class="ctl" id="ctlSec" hidden>
      <label for="secY">Position de la coupe <b id="secYv"></b></label>
      <input id="secY" type="range" min="285" max="1730" step="1" value="815">
    </div>
    <div class="ctl">
      <label for="sunH">Soleil · équinoxe <b id="sunHv"></b></label>
      <input id="sunH" type="range" min="7" max="18.5" step="0.25" value="15">
    </div>
    <div class="toggles">
      <label><input type="checkbox" id="tCtx" checked> Contexte du site</label>
    </div>
    <div class="legend">
      <span><i style="background:#eeece6"></i>Existant</span>
      <span><i style="background:#d98b81"></i>Créé (rouge)</span>
      <span><i style="background:rgba(217,139,129,.35);border-style:dashed"></i>Supposé</span>
      <span><i style="background:#dddbd5"></i>Voisin, contexte</span>
    </div>

    <details class="checks" id="checks">
      <summary>
        <span class="sum-t">Cohérence des documents</span>
        <span class="counts" id="counts"></span>
      </summary>
      <ol id="checkList"></ol>
    </details>
  </div>
</aside>

<figure class="ref" id="ref" hidden>
  <button class="thumb" id="refThumb" aria-label="Agrandir le dessin d'origine"><img id="refImg" alt=""></button>
  <div class="ref-b">
    <div class="ref-t"><strong id="refName"></strong><span id="refScale"></span></div>
    <div class="toggles"><label><input type="checkbox" id="tOv" checked> Calquer sur la maquette</label></div>
    <div class="ctl">
      <label for="ovOp">Opacité du calque <b id="ovOpv"></b></label>
      <input id="ovOp" type="range" min="0.1" max="1" step="0.05" value="0.6">
    </div>
    <p class="ref-note" id="refNote"></p>
  </div>
</figure>

<div class="hud">
  <div class="compass" id="compass" title="Nord du plan">
    <svg viewBox="-24 -24 48 48" id="needle" aria-hidden="true">
      <path d="M0,-19 L5,2 L0,-2 L-5,2 Z" fill="var(--accent)"/>
      <path d="M0,19 L5,2 L0,-2 L-5,2 Z" fill="none" stroke="var(--muted)" stroke-width="1"/>
      <text x="0" y="-8" text-anchor="middle" font-size="7" font-family="IBM Plex Mono, monospace" fill="var(--paper)" font-weight="600">N</text>
    </svg>
  </div>
  <div class="facing" id="facing" hidden></div>
  <div class="scalebar" id="scalebar" hidden>
    <div class="bar"><i id="sb1"></i><i id="sb2"></i></div>
    <div class="nums"><span>0</span><span id="sbMid"></span><span id="sbEnd"></span></div>
  </div>
</div>
<div class="hint" id="hint"></div>

<div class="lightbox" id="lightbox" hidden>
  <div class="lb-top"><span id="lbTitle"></span><span><button id="lbZoom">Zoom ×2</button> <button id="lbClose">Fermer</button></span></div>
  <div class="lb-img"><img id="lbImg" alt=""></div>
</div>

<div id="povUi" hidden>
  <div class="pov-bar"><button id="povBack">← Vue d'ensemble</button><span class="pov-room" id="povRoom"></span></div>
  <div class="pov-help" id="povHelp"></div>
  <div class="pad" id="pad" aria-label="Déplacement">
    <button class="u" data-k="f" aria-label="Avancer">▲</button><button class="l" data-k="l" aria-label="Gauche">◀</button>
    <button class="d" data-k="b" aria-label="Reculer">▼</button><button class="r" data-k="r" aria-label="Droite">▶</button>
  </div>
</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

/* ======================================================================
   Repère : coordonnées en pixels du plan RDC affiché (95 px = 1 m),
   hauteurs en mètres depuis le sol fini du RDC (±0,00).
   Cotes verticales relevées sur la coupe AA (1/50) et l'élévation NO (1/100).
   ====================================================================== */
const PX = 1 / 95, OX = 680, OY = 1005;
const X = p => (p - OX) * PX, Z = p => (p - OY) * PX;

const K = {
  ridgeX: 622.5, ridge: 7.40, slope: 0.915,          // toiture principale à 42,5°
  eaveNW: 118, eaveSE: 1127,                          // débords 1,20 m (pointillés rouges du plan)
  bandX: 262, skirtTop: 3.80,                         // pied du bandeau de lucarne
  breakX: 506, dormEaveX: 208, dormEaveH: 4.62,       // lucarne filante nord-ouest
  roofT: 0.35, gfCeil: 2.49, up: 2.76, corr: 5.31, chim: 7.57,
  aRidgeX: 755, aRidge: 6.45, aT: 0.30                // annexe à 45°
};
const mainOut = x => K.ridge - K.slope * Math.abs(x - K.ridgeX) * PX;
const hBreak = mainOut(K.breakX);
const kDorm = (hBreak - K.dormEaveH) / ((K.breakX - K.dormEaveX) * PX);
const dormOut = x => K.dormEaveH + kDorm * (x - K.dormEaveX) * PX;
const kSkirt = (K.skirtTop - 2.50) / ((K.bandX - K.eaveNW) * PX);
const skirtOut = x => 2.50 + kSkirt * (x - K.eaveNW) * PX;
const annexOut = x => K.aRidge - Math.abs(x - K.aRidgeX) * PX;
const NORTH = new THREE.Vector2(-0.5, -0.866);      // nord du plan (flèche à 30° vers la gauche)

/* ---------------------------- rendu ---------------------------- */
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, stencil: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.localClippingEnabled = true;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.02;
const scene = new THREE.Scene();

const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const darkMQ = matchMedia('(prefers-color-scheme: dark)');
const isDark = () => { const t = document.documentElement.dataset.theme; return t ? t === 'dark' : darkMQ.matches; };

/* ------------------------- textures ---------------------------- */
function canvasTex(size, draw) {
  const c = document.createElement('canvas'); c.width = c.height = size;
  draw(c.getContext('2d'), size);
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping; t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8;
  return t;
}
let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const TEX = {
  parquet: canvasTex(512, (g, s) => {          // lames de chêne dans le sens de la longueur
    g.fillStyle = '#c9a274'; g.fillRect(0, 0, s, s);
    const w = 38;
    for (let x = 0; x < s; x += w) {
      let y = -rnd() * 300;
      while (y < s) {
        const L = 220 + rnd() * 120, k = rnd() * 26 - 13;
        g.fillStyle = `rgb(${200 + k},${161 + k},${114 + k})`; g.fillRect(x, y, w - 1, L);
        g.fillStyle = 'rgba(90,60,30,.35)'; g.fillRect(x, y, w, 1.2); y += L;
      }
      g.fillStyle = 'rgba(90,60,30,.4)'; g.fillRect(x + w - 1, 0, 1.2, s);
    }
    for (let i = 0; i < 260; i++) { g.strokeStyle = 'rgba(120,80,40,.07)'; g.beginPath(); const x = rnd() * s; g.moveTo(x, 0); g.lineTo(x + rnd() * 3 - 1.5, s); g.stroke(); }
  }),
  tile: canvasTex(256, (g, s) => {
    g.fillStyle = '#e9ecea'; g.fillRect(0, 0, s, s); g.strokeStyle = '#b6bebb'; g.lineWidth = 2;
    for (let i = 0; i <= s; i += 32) { g.beginPath(); g.moveTo(i, 0); g.lineTo(i, s); g.stroke(); g.beginPath(); g.moveTo(0, i); g.lineTo(s, i); g.stroke(); }
  }),
  slate: canvasTex(256, (g, s) => {           // rangs d'ardoises parallèles au faîtage
    g.fillStyle = '#4c5259'; g.fillRect(0, 0, s, s);
    for (let u = 0; u < s; u += 32) {
      const off = (u / 32) % 2 ? 24 : 0;
      for (let v = -off; v < s; v += 48) {
        const k = rnd() * 14 - 7; g.fillStyle = `rgb(${74 + k},${80 + k},${88 + k})`; g.fillRect(u + 1, v + 1, 30, 46);
      }
      g.fillStyle = 'rgba(20,24,28,.55)'; g.fillRect(u, 0, 2, s);
    }
  }),
  pave: canvasTex(256, (g, s) => {            // opus incertum du plan
    g.fillStyle = '#9f9b92'; g.fillRect(0, 0, s, s);
    const pts = []; for (let i = 0; i < 46; i++) pts.push([rnd() * s, rnd() * s, rnd()]);
    for (let y = 0; y < s; y += 2) for (let x = 0; x < s; x += 2) {
      let d1 = 1e9, d2 = 1e9, k = 0;
      for (let i = 0; i < pts.length; i++) for (const ox of [-s, 0, s]) for (const oy of [-s, 0, s]) {
        const dx = x - pts[i][0] - ox, dy = y - pts[i][1] - oy, d = dx * dx + dy * dy;
        if (d < d1) { d2 = d1; d1 = d; k = i; } else if (d < d2) d2 = d;
      }
      if (Math.sqrt(d2) - Math.sqrt(d1) > 2.6) { const t = pts[k][2] * 18 - 9; g.fillStyle = `rgb(${222 + t},${218 + t},${209 + t})`; g.fillRect(x, y, 2, 2); }
    }
  })
};

/* --------------------- constructeurs géométriques --------------------- */
function planarUV(geo, s) {
  const p = geo.attributes.position, n = geo.attributes.normal, uv = geo.attributes.uv;
  for (let i = 0; i < p.count; i++) {
    const ax = Math.abs(n.getX(i)), ay = Math.abs(n.getY(i)), az = Math.abs(n.getZ(i));
    let u, v;
    if (ay >= ax && ay >= az) { u = p.getX(i); v = p.getZ(i); }
    else if (ax >= az) { u = p.getZ(i); v = p.getY(i); }
    else { u = p.getX(i); v = p.getY(i); }
    uv.setXY(i, u / s, v / s);
  }
}
function push(key, geo) {
  const g = G[key];
  const gg = geo.index ? geo.toNonIndexed() : geo;
  if (!gg.attributes.uv) gg.setAttribute('uv', new THREE.BufferAttribute(new Float32Array(gg.attributes.position.count * 2), 2));
  if (g.uv) planarUV(gg, g.uv);
  g.geos.push(gg);
  if (g.edges) g.egeos.push(new THREE.EdgesGeometry(gg, 30));
}
// boîte : x1..x2, y1..y2 en px du plan, h0..h1 en m
function box(key, x1, y1, x2, y2, h0, h1) {
  if (h1 - h0 < 1e-4 || Math.abs(x2 - x1) < 1e-3 || Math.abs(y2 - y1) < 1e-3) return;
  const g = new THREE.BoxGeometry(Math.abs(x2 - x1) * PX, h1 - h0, Math.abs(y2 - y1) * PX);
  g.translate(X((x1 + x2) / 2), (h0 + h1) / 2, Z((y1 + y2) / 2));
  push(key, g);
}
function shapeOf(pts, map) {
  const s = new THREE.Shape();
  pts.forEach((p, i) => { const [a, b] = map(p); i ? s.lineTo(a, b) : s.moveTo(a, b); });
  return s;
}
function pathOf(pts, map) {
  const s = new THREE.Path();
  pts.forEach((p, i) => { const [a, b] = map(p); i ? s.lineTo(a, b) : s.moveTo(a, b); });
  return s;
}
// profil (x plan, h) extrudé le long du plan entre y1 et y2
function ez(key, pts, y1, y2, holes = []) {
  const m = ([x, h]) => [X(x), h];
  const s = shapeOf(pts, m); holes.forEach(hp => s.holes.push(pathOf(hp, m)));
  const g = new THREE.ExtrudeGeometry(s, { depth: (y2 - y1) * PX, bevelEnabled: false, curveSegments: 12 });
  g.translate(0, 0, Z(y1)); push(key, g);
}
// profil (y plan, h) extrudé entre x1 et x2
function ex(key, pts, x1, x2, holes = []) {
  const m = ([y, h]) => [Z(y), h];
  const s = shapeOf(pts, m); holes.forEach(hp => s.holes.push(pathOf(hp, m)));
  const g = new THREE.ExtrudeGeometry(s, { depth: (x2 - x1) * PX, bevelEnabled: false, curveSegments: 12 });
  g.rotateY(-Math.PI / 2); g.translate(X(x2), 0, 0); push(key, g);
}
// polygone en plan extrudé verticalement
function ey(key, pts, h0, h1, holes = []) {
  const m = ([x, y]) => [X(x), Z(y)];
  const s = shapeOf(pts, m); holes.forEach(hp => s.holes.push(pathOf(hp, m)));
  const g = new THREE.ExtrudeGeometry(s, { depth: h1 - h0, bevelEnabled: false, curveSegments: 16 });
  g.rotateX(Math.PI / 2); g.translate(0, h1, 0); push(key, g);
}
function cyl(key, px, py, r, h0, h1, seg = 20) {
  const g = new THREE.CylinderGeometry(r, r, h1 - h0, seg);
  g.translate(X(px), (h0 + h1) / 2, Z(py)); push(key, g);
}
const arcPts = (cx, cy, r, a0, a1, n = 10) => Array.from({ length: n + 1 }, (_, i) => { const a = a0 + (a1 - a0) * i / n; return [cx + Math.cos(a) * r, cy + Math.sin(a) * r]; });

// ouverture [début, fin, bas, haut, cintre?] dans le repère (le long du mur, h)
function openingPts([s, e, hb, ht, arch]) {
  if (!arch) return [[s, hb], [e, hb], [e, ht], [s, ht]];
  const r = (e - s) / 2, c = (s + e) / 2, pts = [[s, hb], [e, hb], [e, ht]];
  for (let i = 1; i < 18; i++) { const a = Math.PI * i / 18; pts.push([c + r * Math.cos(a), ht + r * PX * Math.sin(a)]); }
  pts.push([s, ht]); return pts;
}
function wallProfile(a0, a1, h0, h1, ops) {
  const doors = ops.filter(o => o[2] <= h0 + 1e-3).sort((p, q) => p[0] - q[0]);
  const out = [[a0, h0]];
  for (const [s, e, , ht] of doors) out.push([s, h0], [s, ht], [e, ht], [e, h0]);
  out.push([a1, h0], [a1, h1], [a0, h1]);
  return { out, holes: ops.filter(o => o[2] > h0 + 1e-3).map(openingPts) };
}
// mur courant le long de y (épaisseur x1..x2) / le long de x (épaisseur y1..y2)
function wallY(key, x1, x2, ya, yb, h0, h1, ops = []) { const p = wallProfile(ya, yb, h0, h1, ops); ex(key, p.out, x1, x2, p.holes); }
function wallX(key, y1, y2, xa, xb, h0, h1, ops = []) { const p = wallProfile(xa, xb, h0, h1, ops); ez(key, p.out, y1, y2, p.holes); }

// menuiserie : cadre + vitrage dans un mur courant le long de y (axe 'y') ou de x (axe 'x')
function joinery(axis, t0, t1, s, e, hb, ht, o = {}) {
  const f = 6, fh = 0.06, mid = (t0 + t1) / 2;
  const B = (key, a, b, h0, h1, u0 = t0, u1 = t1) => axis === 'y' ? box(key, u0, a, u1, b, h0, h1) : box(key, a, u0, b, u1, h0, h1);
  B('frame', s, s + f, hb, ht); B('frame', e - f, e, hb, ht);
  B('frame', s, e, ht - fh, ht); B('frame', s, e, hb, hb + fh);
  const leaves = o.leaves || 1;
  for (let i = 1; i < leaves; i++) { const c = s + (e - s) * i / leaves; B('frame', c - f * 0.7, c + f * 0.7, hb, ht); }
  if (o.transom) B('frame', s, e, o.transom - fh / 2, o.transom + fh / 2);
  B('glass', s + f, e - f, hb + fh, ht - fh, mid - 0.6, mid + 0.6);
}
function archJoinery(t0, t1, s, e, hb, hs) {    // vitrage cintré dans un mur le long de y
  const outer = openingPts([s, e, hb, hs, true]);
  const inner = openingPts([s + 6, e - 6, hb + 0.06, hs, true]);
  ex('frame', outer, t0, t1, [inner]);
  ex('glass', inner, (t0 + t1) / 2 - 0.6, (t0 + t1) / 2 + 0.6);
}
// volets battants ouverts contre la façade (x0..x1 : épaisseur côté extérieur)
function shutters(x0, x1, s, e, h1) {
  const w = (e - s) / 2;
  for (const [a, b] of [[s - w, s], [e, e + w]]) {
    box('shutter', x0, a + 1, x1, b - 1, 0.03, h1);
    for (const h of [0.28, h1 - 0.32]) box('frame', x0 - 0.8, a + 3, x0, b - 3, h, h + 0.05);
  }
}

const layers = { house: [], ground: [earth], ctx: [], far: [] };
const caps = [], stencils = [];
const capGeo = new THREE.PlaneGeometry(500, 500);
let order = 1;
function stencilMat(side, op, clip) {
  const m = new THREE.MeshBasicMaterial({ side, colorWrite: false, depthWrite: false, depthTest: false, stencilWrite: true,
    stencilFunc: THREE.AlwaysStencilFunc, stencilFail: op, stencilZFail: op, stencilZPass: op });
  m.clippingPlanes = clip; return m;
}
function addCaps(geo, hex, layer) {   // remplissage des parties coupées (poché), technique du stencil
  const env = layer !== 'house', clip = env ? CLIP_ENV : CLIP, plane = env ? envCut : cut;
  const back = new THREE.Mesh(geo, stencilMat(THREE.BackSide, THREE.IncrementWrapStencilOp, clip));
  const front = new THREE.Mesh(geo, stencilMat(THREE.FrontSide, THREE.DecrementWrapStencilOp, clip));
  back.renderOrder = front.renderOrder = order;
  const cap = new THREE.Mesh(capGeo, new THREE.MeshBasicMaterial({ color: hex, side: THREE.DoubleSide, toneMapped: false,
    stencilWrite: true, stencilRef: 0, stencilFunc: THREE.NotEqualStencilFunc,
    stencilFail: THREE.ReplaceStencilOp, stencilZFail: THREE.ReplaceStencilOp, stencilZPass: THREE.ReplaceStencilOp }));
  cap.renderOrder = order + 0.5; cap.onAfterRender = r => r.clearStencil();
  order++;
  for (const m of [back, front, cap]) { m.frustumCulled = false; m.userData.plane = plane; scene.add(m); layers[layer].push(m); }
  stencils.push(back, front); caps.push(cap);
}

function bearingVec(deg) {               // relèvement (° depuis le nord) → vecteur (X, Z)
  const b = deg * Math.PI / 180, c = Math.cos(b), s = Math.sin(b);
  return new THREE.Vector2(NORTH.x * c - NORTH.y * s, NORTH.x * s + NORTH.y * c);
}
function setSun(hour) {                  // course du soleil à l'équinoxe, latitude 48° N
  const H = (hour - 12) * 15 * Math.PI / 180, lat = 48 * Math.PI / 180;
  const el = Math.asin(Math.cos(lat) * Math.cos(H));
  const az = 180 + Math.atan2(Math.sin(H), Math.sin(lat) * Math.cos(H)) * 180 / Math.PI;
  const d = bearingVec(az), D = 60, e = Math.max(el, 0.05);
  sun.position.set(sun.target.position.x + d.x * Math.cos(e) * D, Math.sin(e) * D, sun.target.position.z + d.y * Math.cos(e) * D);
  sun.intensity = 2.6 * Math.min(1, Math.max(0.15, Math.sin(el) * 2.2));
  const hh = Math.floor(hour), mm = Math.round((hour - hh) * 60);
  document.getElementById('sunHv').textContent = `${hh} h${mm ? String(mm).padStart(2, '0') : ''} · azimut ${Math.round(az)}°`;

const loader = new THREE.TextureLoader();
const ovMats = [];
function overlay(key, w, h, place) {
  const tex = loader.load(IMG[key]); tex.colorSpace = THREE.NoColorSpace; tex.anisotropy = 8;
  const m = new THREE.ShaderMaterial({
    uniforms: { map: { value: tex }, uOp: { value: 0.6 }, uDark: { value: 0 } },
    vertexShader: 'varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }',
    fragmentShader: `uniform sampler2D map; uniform float uOp; uniform float uDark; varying vec2 vUv;
      void main(){ vec3 c = texture2D(map, vUv).rgb;
        if(uDark < 0.5){ gl_FragColor = vec4(mix(vec3(1.0), c, uOp), 1.0); }
        else { float l = dot(c, vec3(.299,.587,.114)); gl_FragColor = vec4(vec3(1.0,.95,.88) * (1.0 - l) * uOp, 1.0); } }`,
    transparent: true, depthTest: false, depthWrite: false, side: THREE.DoubleSide
  });
  ovMats.push(m);
  const mesh = new THREE.Mesh(new THREE.PlaneGeometry(w, h), m);
  place(mesh); mesh.renderOrder = 3000; mesh.visible = false; scene.add(mesh);
  return mesh;
}
function setOverlayBlend() {
  const d = isDark();
  for (const m of ovMats) {
    m.uniforms.uDark.value = d ? 1 : 0;
    if (d) { m.blending = THREE.AdditiveBlending; }
    else { m.blending = THREE.CustomBlending; m.blendEquation = THREE.AddEquation; m.blendSrc = THREE.DstColorFactor; m.blendDst = THREE.ZeroFactor; }
    m.needsUpdate = true;
  }
}

function panelOffset() { const p = document.getElementById('panel'); return innerWidth > 820 ? p.getBoundingClientRect().right : 0; }
function frame() {
  const W = innerWidth, H = innerHeight, off = mode === 'pov' ? 0 : panelOffset();
  renderer.setSize(W, H, false);
  povCam.aspect = W / H; povCam.fov = W < H ? 90 : 74; povCam.updateProjectionMatrix();
  persp.aspect = (W + off) / H; persp.setViewOffset(W + off, H, 0, 0, W, H); persp.updateProjectionMatrix();
  const V = VIEWS[state.view];
  if (V.fit) {

    ortho.top = vh / 2; ortho.bottom = -vh / 2; ortho.left = -vh * (W + off) / H / 2; ortho.right = vh * (W + off) / H / 2;

function setCutPlane(n, c, env = true) {
  cut.normal.copy(n); cut.constant = c;
  if (env) { envCut.normal.copy(n); envCut.constant = c; } else { envCut.normal.set(0, -1, 0); envCut.constant = 1000; }
  for (const m of caps) {
    const pl = m.userData.plane, p = pl.coplanarPoint(new THREE.Vector3());
    m.position.copy(p); m.lookAt(p.clone().sub(pl.normal));
  }
  for (const m of [...stencils, ...caps]) m.userData.cutOn = m.userData.plane.constant < 900;

}
function applyLayers() {

    const on = k === 'far' ? state.ctx && !side : (k !== 'ctx' || state.ctx);

  if (t !== lastRoom) { povRoom.textContent = t; lastRoom = t; }
}

/* ============================ thème ============================ */
function syncTheme() { scene.background = new THREE.Color(css('--scene') || '#e6e7e2'); setOverlayBlend(); }
darkMQ.addEventListener('change', syncTheme);
new MutationObserver(syncTheme).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });

/* ============================ boucle ============================ */
syncTheme(); setSun(+sunH.value); setOp(state.ovOp); setCutH(8);
setView(state.view);
addEventListener('resize', frame);
const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 0.05);
  if (mode === 'pov') { updatePOV(dt); updatePovRoom(); }
  else {
    (cam === persp ? ctlP : ctlO).update();
    if (pointer.dirty) { pointer.dirty = false; setHovered(pickRoom(pointer.x, pointer.y)); }
  }
  renderer.render(scene, cam);
  if (mode !== 'pov') { placeLabels(); updateHud(); }
});
window.__ker = { scene, setView, state, ortho, ctlO, persp, ctlP, enterPOV, exitPOV, player, keys, SPAWN };
</script>
